name: BuildPulse CI

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    # runs-on: bp-ubuntu-latest-x64-2x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Build binary
        run: go build -o karpenter ./cmd/controller

  release:
    name: Tag and Release
    needs: build
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/')
    # runs-on: bp-ubuntu-latest-x64-2x
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from branch name
        id: version
        run: |
          # release/v0.0.8 -> v0.0.8
          VERSION="${GITHUB_REF_NAME#release/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create and push tag (force if exists)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }} --force
